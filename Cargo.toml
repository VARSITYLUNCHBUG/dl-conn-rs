[package]
name = "dl-conn-rs"
version = "0.2.0"
edition = "2024"
publish = false
license = "MIT"
repository = "https://github.com/VARSITYLUNCHBUG/dl-conn-rs"

# The bin carries the admin manifest, so it must not be run as a test harness.
[[bin]]
name = "dl-conn-rs"
path = "src/main.rs"
test = false

[dependencies]
miniserde = "0.1"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "wgpu_no_default_features"] }
# Only DirectX 12: the Windows software renderer covers machines with no usable GPU.
wgpu = { version = "30", default-features = false, features = ["dx12", "wgsl", "std", "parking_lot"] }

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",

    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",

    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Rpc",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",

    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["snapshot", "wgpu"] }
winit = "0.30"
# Display mode changes, for examples/fullscreen.rs only.
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
